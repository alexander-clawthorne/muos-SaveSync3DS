# 3DS Save Sync - settings
#
# Read by both main.lua (the on-device UI) and sync3ds.py (the transfers).
# Every key is optional; delete a line to go back to its default.
# Anything you set here is also overridable with a SYNC3DS_<KEY> env var.

# --- your 3DS ---------------------------------------------------------
# Leave blank on a fresh install: the app asks for the IP on first run and
# writes it back here. ftpd shows the address on the 3DS screen.
ip=

# ftpd's port, and its login. ftpd's default is anonymous with no password;
# set these only if you changed them in ftpd's settings.
#port=5000
#user=anonymous
#pass=

# Seconds to wait for the 3DS before giving up.
#timeout=10

# Where ftpd exposes your DS ROMs. The .nds files may be directly in here or
# one level down in letter folders - both layouts are handled.
#remote_rom_root=/roms/nds

# --- your handheld ----------------------------------------------------
# Where DraStic keeps its save backups on this device.
#save_dir=/mnt/mmc/MUOS/save/drastic/backup

# How many timestamped backups to keep before the oldest is dropped.
#backups_kept=10

# Where to look for DS ROMs locally, comma separated, first match wins.
#rom_dirs=/mnt/sdcard/ROMS/DS,/mnt/sdcard/ROMS/NDS,/mnt/mmc/ROMS/DS,/mnt/mmc/ROMS/NDS

# Python 3 interpreter used to run sync3ds.py.
#python=/usr/bin/python3
